name: Build iOS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Show Xcode Project Information
        run: |
          xcodebuild \
            -project tvbox.xcodeproj \
            -list

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Find Built App
        run: |
          echo "Searching for built .app..."
          find build -type d -name "*.app" -print

      - name: Package Simulator App
        run: |
          APP_PATH=$(find build -type d -name "tvbox.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: tvbox.app was not found."
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p artifact
          cp -R "$APP_PATH" artifact/

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-Simulator
          path: artifact/tvbox.app
