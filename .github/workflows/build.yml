name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew & Install XcodeGen
        run: |
          # Disable Homebrew tap trust check to prevent exit code 1 during formula updates
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          # Find the generated workspace or project file
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          
          echo "Building scheme $SCHEME_NAME from $PROJECT_FILE..."
          
          # Build .app file without code signing
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

      - name: Package .app into .ipa
        run: |
          # Package the output .app bundle into an unsigned Payload/.ipa structure
          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r TVBox.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-App
          path: TVBox.ipa
