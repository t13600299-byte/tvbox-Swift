name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew & Install XcodeGen
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="0000000000" \
            BUILD_DIR=build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app file found in build directory."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r TVBox.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-App
          path: TVBox.ipa
