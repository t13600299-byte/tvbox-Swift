name: Build iOS Simulator

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Show Xcode Project Information
        run: |
          xcodebuild \
            -project tvbox.xcodeproj \
            -list

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Find Built App
        run: |
          echo "======================================"
          echo "Searching for .app files..."
          echo "======================================"

          find build \
            -type d \
            -name "*.app" \
            -print

      - name: Package Simulator App
        run: |
          set -e

          APP_PATH=$(find build -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app file was found."
            echo ""
            echo "Build directory contents:"
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "======================================"
          echo "Found application:"
          echo "$APP_PATH"
          echo "======================================"

          mkdir -p artifact/Payload

          cp -R "$APP_PATH" artifact/Payload/

          cd artifact

          zip -r TVBox-Simulator.zip Payload

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-Simulator
          path: artifact/TVBox-Simulator.zip
